#source = ~/.config/hypr/configs/env_var.conf
#source = ~/.config/hypr/configs/env_nvidia.conf

$scripts = .config/hypr/scripts

# You have to change this based on your monitor 
# High resolution laptop — scale 1.5 makes UI bigger, adjust to 1.25 or 2 to taste

# --- NORMAL SETUP ---

#monitor=eDP-1,2880x1800@60,auto,1.67
monitor=eDP-1,2880x1800@60,auto,1.67
#monitor=HDMI-A-1,preferred,auto,1


# --- MIRROR MODE (1080p presentation) ---
# Set both monitors to same resolution
# Replace HDMI-A-1 if your external has a different name

#monitor=eDP-1,1920x1080@60,0x0,1
#monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1

#Mirror external to laptop
#monitor = ,highres,auto,1.67




# Status bar
# exec-once=eww open bar
exec-once=waybar
exec-once = $scripts/xdgdesktop
exec-once = $scripts/gtkthemes

xwayland {
    force_zero_scaling = true
}

#Notification 
exec-once=dunst

# Screenshots
bind = , Print, exec, hyprshot -m region
bind = ALT, Print, exec, hyprshot -m window
bind = CTRL, Print, exec, hyprshot -m output            # capture whole screen
# Wallpaper
exec-once=swww-daemon && swww img /home/arminas/Pictures/wallpapers/background.png
#Start Page
#exec-once=~/.config/hypr/scripts/startpage.sh

# Bluetooth
exec-once=blueman-applet # Make sure you have installed blueman

# Screen Sharing 
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=~/.config/hypr/scripts/screensharing.sh

# Some default env vars.
env = XCURSOR_SIZE,18
env = XCURSOR_THEME,Dracula
env = QT_AUTO_SCREEN_SCALE_FACTOR,0.5
env = QT_SCALE_FACTOR,0.5
env = GDK_SCALE,2
env = ELECTRON_OZONE_PLATFORM_HINT,auto
input {
  kb_layout = us,lt
  kb_options = grp:alt_shift_toggle
  follow_mouse = 1
  kb_options = grp:alt_shift_toggle,caps:none
  touchpad {
    disable_while_typing=1
    natural_scroll=1
    clickfinger_behavior=1
    middle_button_emulation=0
    tap-to-click=1
    scroll_factor=1.0
  }
  sensitivity = 0.25 # -1.0 - 1.0, higher = faster
  
}

# gestures — use new gesture = lines instead (see below)

general {
    layout=dwindle
    gaps_in=3
    gaps_out=8
    border_size=2
    #col.active_border=0xff5e81ac
    col.active_border=0xffff00ff
    col.inactive_border=0x66333333
}

decoration {
    rounding=5
    active_opacity=0.95
    inactive_opacity=0.8
    fullscreen_opacity=1.0

    blur {
        enabled=true
        size=10
        passes=4
        new_optimizations=true
        special=true
    }

    shadow {
        enabled=true
        range=10
        render_power=3
        color=0xffffc0cb
        color_inactive=0x50000000
    }
}

animations {
    enabled=yes
    bezier=easeInOut,0.4,0,0.2,1
    animation=windows,1,1,easeInOut,slide
    animation=fade,1,1,easeInOut
    animation=workspaces,1,1,easeInOut,slide
}

dwindle {
    pseudotile=1 # enable pseudotiling on dwindle
    # force_split=2
    preserve_split = yes # you probably want this
}

master {
  new_status = master
}

misc {
  disable_hyprland_logo=true
  disable_splash_rendering=true

}

############ Window Rules

# Float Necessary Windows
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(chromium)$
windowrule = float on, match:title ^(btop)$
windowrule = float on, match:title ^(update-sys)$

# Opacity rules
windowrule = opacity 0.8 override 0.8 override, match:class ^(kitty)$
windowrule = opacity 0.8 override 0.8 override, match:class ^(thunar)$
windowrule = opacity 0.8 override 0.8 override, match:class ^(code)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(neovim)$

# Tiling
windowrule = tile on, match:class ^(firefox-developer-edition)$
windowrule = tile on, match:class ^(Spotify)$

# Workspace assignments
windowrule = workspace 3 silent, match:class ^(discord)$
windowrule = workspace 10 silent, match:class ^(Spotify)$

################# Bindings
$mainMod = SUPER
# Move windows with mainMod + CTRL + arrow keys
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d
# Resize windows with mainMod + SHIFT + arrow keys
binde = $mainMod SHIFT, right, resizeactive, 30 0
binde = $mainMod SHIFT, left, resizeactive, -30 0
binde = $mainMod SHIFT, up, resizeactive, 0 -30
binde = $mainMod SHIFT, down, resizeactive, 0 30

gesture = 3, horizontal, workspace
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod SHIFT, RETURN, exec, kitty ranger
bind = $mainMod, Space, togglefloating,
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, thunar
bind = CTRL ALT, S, exec, env LD_PRELOAD=/usr/lib/spotify-adblock.so spotify --uri=U%
bind = CTRL ALT, S, workspace, 10
bind = $mainMod, L, exec, wlogout
bind = $mainMod, X, exec, ~/.config/waybar/scripts/power-menu/powermenu.sh
bind = $mainMod, R, exec, discord
bind = $mainMod, R, workspace, 3
bind = CTRL ALT, C, exec, code
bind = $mainMod, W, exec, zen-browser
bind = $mainMod, F, fullscreen


# example binds
bind=,XF86AudioMute,exec,~/.config/hypr/scripts/volume mute
bindle=,XF86AudioLowerVolume,exec,~/.config/hypr/scripts/volume down
bindle=,XF86AudioRaiseVolume,exec,~/.config/hypr/scripts/volume up
bind=,XF86AudioMicMute,exec,pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindle=,XF86MonBrightnessUp,exec,~/.config/hypr/scripts/brightness up
bindle=,XF86MonBrightnessDown,exec,~/.config/hypr/scripts/brightness down

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

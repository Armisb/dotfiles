# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# NOTES: This is only for Hyprland > 0.48

# note for ja: This should NOT be implemented on Debian and Ubuntu

# windowrule - tags - add apps under appropriate tag to use the same settings
# browser tags
windowrule = tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, match:class ^([Cc]hromium)$
windowrule = tag +browser, match:class ([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag +browser, match:class ^(zen-alpha|zen)$

#force workspaces
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2


# notif tags
windowrule = tag +notif, match:class ^(swaync-control-center on|swaync-notification-window|swaync-client|class)$

# KooL settings tag
windowrule = tag +KooL_Cheat, match:title ^(KooL Quick Cheat Sheet)$
windowrule = tag +KooL_Settings, match:title ^(KooL Hyprland Settings)$
windowrule = tag +KooL-Settings, match:class ^(nwg-displays|nwg-look)$

# terminal tags
windowrule = tag +terminal, match:class ^(Alacritty|kitty|kitty-dropterm)$

# email tags
windowrule = tag +email, match:class ^([Tt]hunderbird|org.gnome.Evolution)$
windowrule = tag +email, match:class ^(eu.betterbird.Betterbird)$

# project tags
windowrule = tag +projects, match:class ^(codium|codium-url-handler|VSCodium)$
windowrule = tag +projects, match:class ^(VSCode|code-url-handler)$
#windowrule = tag +projects, match:class ^(jetbrains-.+)$ # JetBrains IDEs

#

# screenshare tags
windowrule = tag +screenshare, match:class ^(com.obsproject.Studio)$

# IM tags
windowrule = tag +im, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
windowrule = tag +im, match:class ^([Ff]erdium)$
windowrule = tag +im, match:class ^([Ww]hatsapp-for-linux)$
windowrule = tag +im, match:class ^(ZapZap|com.rtosta.zapzap)$
windowrule = tag +im, match:class ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$
windowrule = tag +im, match:class ^(teams-for-linux)$
windowrule = tag +im, match:class ^(im.riot.Riot|Element)$ # Element Matrix client

# game tags
windowrule = tag +games, match:class ^(gamescope)$
windowrule = tag +games, match:class ^(steam_app_\d+)$

# gamestore tags
windowrule = tag +gamestore, match:class ^([Ss]team)$
windowrule = tag +gamestore, match:title ^([Ll]utris)$
windowrule = tag +gamestore, match:class ^(com.heroicgameslauncher.hgl)$

# file-manager tags
windowrule = tag +file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
windowrule = tag +file-manager, match:class ^(app.drey.Warp)$

# wallpaper tags
windowrule = tag +wallpaper, match:class ^([Ww]aytrogen)$

# multimedia tags
windowrule = tag +multimedia, match:class ^([Aa]udacious)$
windowrule = tag +multimedia, match:class ^([Ss]potify)$
windowrule = tag +multimedia, match:class ^([Sspotify [Ff]ree)$

# multimedia-video tags
windowrule = tag +multimedia_video, match:class ^([Mm]pv|vlc)$

# settings tags
windowrule = tag +settings, match:title ^(ROG Control)$
windowrule = tag +settings, match:class ^(wihotspot(-gui)?)$ # wifi hotspot
windowrule = tag +settings, match:class ^([Bb]aobab|org.gnome.[Bb]aobab)$ # Disk usage analyzer
windowrule = tag +settings, match:class ^(gnome-disks|wihotspot(-gui)?)$
windowrule = tag +settings, match:title (Kvantum Manager)
windowrule = tag +settings, match:class ^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrule = tag +settings, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = tag +settings, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = tag +settings, match:class ^(qt5ct|qt6ct|[Yy]ad)$
windowrule = tag +settings, match:class (xdg-desktop-portal-gtk)
windowrule = tag +settings, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = tag +settings, match:class ^([Rr]ofi)$

# viewer tags
windowrule = tag +viewer, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter on.MissionCenter)$ # system monitor
windowrule = tag +viewer, match:class ^(evince)$ # document viewer 
windowrule = tag +viewer, match:class ^(eog|org.gnome.Loupe)$ # image viewer

# Some special override rules
windowrule = no_blur on, tag multimedia_video*
windowrule = opacity 1.0, tag multimedia_video*
 
# POSITION
# windowrule = center on,floating:1 # warning, it cause even the menu to float and center.
windowrule = center on, match:tag KooL_Cheat*
windowrule = center on, match:class ([Tt]hunar), match:title negative:(.*[Tt]hunar.*)
windowrule = center on, match:title ^(ROG Control)$
windowrule = center on, tag KooL-Settings*
windowrule = center on, match:title ^(Keybindings)$
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = center on, match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrule = center on, match:class ^([Ff]erdium)$
windowrule = move 72% 7%,match:title ^(Picture-in-Picture)$ 
#windowrule = move 72% 7%,match:title ^(Firefox)$ 

# windowrule to avoid idle for fullscreen apps
#windowrule = idleinhibit fullscreen, match:class ^(*)$
#windowrule = idleinhibit fullscreen, match:title ^(*)$
windowrule = idle_inhibit fullscreen

# windowrule move to workspace
#windowrule = workspace 1, tag browser*
#windowrule = workspace 2, tag browser*
#windowrule = workspace 3, match:class ^([Tt]hunar)$
#windowrule = workspace 3, match:class im*
#windowrule = workspace 3, tag projects*
#windowrule = workspace 5, tag gamestore*
windowrule = workspace 7, tag multimedia*
windowrule = workspace 8, tag games*

# windowrule move to workspace (silent)

# IM
windowrule = workspace 3 silent, match:class ^(discord|WebCord|Vesktop|Ferdium|whatsapp-for-linux|ZapZap|com.rtosta.zapzap|org.telegram.desktop|io.github.tdesktop_x64.TDesktop|teams-for-linux|im.riot.Riot|Element)$

# Screenshare
windowrule = workspace 4 silent, match:class ^(com.obsproject.Studio)$

# Gamestore
windowrule = workspace 5 silent, match:class ^([Ss]team|com.heroicgameslauncher.hgl)$
windowrule = workspace 5 silent, match:title ^([Ll]utris)$

# Multimedia
windowrule = workspace 7, match:class ^([Aa]udacious|[Ss]potify)$

# Games
windowrule = workspace 8, match:class ^(gamescope|steam_app_\d+)$
# FLOAT
windowrule = match:float true, tag KooL_Cheat*
windowrule = match:float true, tag wallpaper*
windowrule = match:float true, tag settings*
windowrule = match:float true, tag viewer*
windowrule = match:float true, tag KooL-Settings*
windowrule = match:float true, match:class ([Zz]oom|onedriver|onedriver-launcher)$
windowrule = match:float true, match:class (org.gnome.Calculator), match:title (Calculator)
windowrule = match:float true, match:class ^(mpv|com.github.rafostar.Clapper)$
windowrule = match:float true, match:class ^([Qq]alculate-gtk)$
#windowrule = match:float true, match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrule = match:float true, match:class ^([Ff]erdium)$
windowrule = match:float true, match:title ^(Picture-in-Picture)$
#windowrule = match:float true, match:title ^(Firefox)$

# windowrule - ######### float popups and dialogue #######
windowrule = float on, match:title ^(Authentication Required)$
windowrule = center on, match:title ^(Authentication Required)$
windowrule = float on, match:class (codium|codium-url-handler|VSCodium), match:title negative:(.*codium.*|.*VSCodium.*)
windowrule = float on, match:class ^(com.heroicgameslauncher.hgl)$, match:title negative:(Heroic Games Launcher)
windowrule = float on, match:class ^([Ss]team)$, match:title negative:^([Ss]team)$
windowrule = float on, match:class ([Tt]hunar), match:title negative:(.*[Tt]hunar.*)

windowrule = float on, match:title ^(Add Folder to Workspace)$
windowrule = size 70% 60%, match:title ^(Add Folder to Workspace)$
windowrule = center on, match:title ^(Add Folder to Workspace)$

windowrule = float on, match:title ^(Save As)$
windowrule = size 70% 60%, match:title ^(Save As)$
windowrule = center on, match:title ^(Save As)$
windowrule = float on, match:initial_title (Open Files)
windowrule = size 70% 60%, match:initial_title (Open Files)

windowrule = float on, match:title ^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
windowrule = center on, match:title ^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
windowrule = size 16% 12%, match:title ^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
# END of float popups and dialogue #######

# OPACITY
windowrule = opacity 1.0 0.9, tag browser*
windowrule = opacity 0.8 0.9, tag projects*
windowrule = opacity 0.94 0.86, tag im*
windowrule = opacity 0.94 0.86, tag multimedia*
windowrule = opacity 0.9 0.8, tag file-manager*
windowrule = opacity 0.8 0.7, tag terminal*
windowrule = opacity 0.8 0.7, tag settings*
windowrule = opacity 0.82 0.75, tag viewer*
windowrule = opacity 0.9 0.7, tag wallpaper*
windowrule = opacity 0.8 0.7, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 0.9 0.8, match:class ^(deluge)$
windowrule = opacity 0.9 0.8, match:class ^(seahorse)$ # gnome-keyring gui
windowrule = opacity 0.95 0.75, match:title ^(Picture-in-Picture)$

# SIZE
windowrule = size 65% 90%, tag KooL_Cheat*
windowrule = size 70% 70%, tag wallpaper*
windowrule = size 70% 70%, tag settings*
windowrule = size 60% 70%, match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrule = size 60% 70%, match:class ^([Ff]erdium)$

#windowrule = size 25% 25%, match:title ^(Picture-in-Picture)$   
#windowrule = size 25% 25%, match:title ^(Firefox)$ 

# PINNING
windowrule = pin on, match:title ^(Picture-in-Picture)$
#windowrule = pin on, match:title ^(Firefox)$ 

# windowrule - extras
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$

# BLUR & FULLSCREEN
windowrule = no_blur on, tag games*
windowrule = fullscreen on, tag games*

#windowrule = bordercolor rgb(EE4B55) rgb(880808), fullscreen:1
#windowrule = bordercolor rgb(282737) rgb(1E1D2D), floating:1
#windowrule = opacity 0.8 0.8, pinned:1

# LAYER RULES
layerrule = blur on, match:title rofi
#layerrule = ignorezero, match:title rofi
layerrule = blur on, match:title notifications
#layerrule = ignorezero, notifications
layerrule = blur on, match:title quickshell:overview
#layerrule = ignorezero, quickshell:overview
layerrule = ignore_alpha 0.5, match:title quickshell:overview

#layerrule = ignorealpha 0.5, tag notif*

#layerrule = ignorezero, match:class ^([Rr]ofi)$
#layerrule = blur, match:class ^([Rr]ofi)$
#layerrule = unset,match:class ^([Rr]ofi)$
#layerrule = ignorezero, <rofi>

#layerrule = ignorezero, overview
#layerrule = blur, overview
windowrule {
    name = noblur-all
    match:class = .*
    no_blur = on
}
